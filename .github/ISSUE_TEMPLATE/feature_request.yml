name: Feature request
description: Propose a scoped skill, harness, workflow, or documentation improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain what should change and how someone would use it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - New or existing skill
        - Agent harness compatibility
        - Installer
        - Helper script
        - Upstream maintenance
        - Documentation or discoverability
    validations:
      required: true
  - type: input
    id: harnesses
    attributes:
      label: Relevant harnesses
      placeholder: Universal, Codex, Claude Code, OpenCode, Pi, Amp, or other
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Link first-party documentation, source commits, comparable workflows, or concrete use cases.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This request keeps external side effects behind explicit authorization.
          required: true
